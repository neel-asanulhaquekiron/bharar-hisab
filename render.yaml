services:
  - type: web
    name: bharar-hisab-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/service-account.json
